<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Navixa Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow-1" aria-hidden="true"></div>

  <main class="login-page">
    <div class="login-card">

      <div class="login-logo">
        <div class="login-logo-mark" aria-hidden="true">🤖</div>
        <h1 class="login-title">Navi<span>xa</span></h1>
        <p class="login-subtitle">Operator Dashboard Access</p>
      </div>

      <form class="login-form" method="POST" action="{{ url_for('login') }}" novalidate>

        {% if error %}
        <div class="login-error" role="alert">
          ⚠ {{ error }}
        </div>
        {% endif %}

        <div class="form-group">
          <label class="form-label" for="password">Access Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter operator password"
            autocomplete="current-password"
            autofocus
            required
          >
        </div>

        <button type="submit" class="btn btn-primary login-btn btn-ripple">
          <span>🔓</span> Access Dashboard
        </button>

        <p class="login-hint">
          Default password: <code style="color:var(--orange); font-family:monospace">navixa2026</code>
        </p>

      </form>

      <div class="login-back">
        <a href="{{ url_for('index') }}">← Back to landing page</a>
      </div>

    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
