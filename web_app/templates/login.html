<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Navixa Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow-1" aria-hidden="true"></div>

  <main class="login-page">
    <div class="login-card">

      <div class="login-logo">
        <!-- Navixa SVG mark -->
        <div class="login-logo-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <rect x="2" y="2" width="60" height="60" rx="14" stroke="#FF6B00" stroke-width="2" fill="rgba(10,10,10,0.7)"/>
            <line x1="18" y1="14" x2="18" y2="50" stroke="white" stroke-width="7" stroke-linecap="round"/>
            <line x1="46" y1="14" x2="46" y2="50" stroke="white" stroke-width="7" stroke-linecap="round"/>
            <line x1="18" y1="14" x2="46" y2="50" stroke="white" stroke-width="6" stroke-linecap="round"/>
            <circle cx="18" cy="16" r="5" fill="#0A0A0A" stroke="#FF6B00" stroke-width="2"/>
            <circle cx="18" cy="16" r="2.2" fill="#FF6B00"/>
            <circle cx="32" cy="32" r="5" fill="#0A0A0A" stroke="#FF6B00" stroke-width="2"/>
            <circle cx="32" cy="32" r="2.2" fill="#FF6B00"/>
            <circle cx="46" cy="48" r="5" fill="#0A0A0A" stroke="#FF6B00" stroke-width="2"/>
            <circle cx="46" cy="48" r="2.2" fill="#FF6B00"/>
          </svg>
        </div>
        <h1 class="login-title">Navi<span>xa</span></h1>
        <p class="login-subtitle">Operator Dashboard Access</p>
      </div>

      <form class="login-form" method="POST" action="{{ url_for('login') }}" novalidate>

        {% if error %}
        <div class="login-error" role="alert">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
            <path d="M8 1L15 14H1L8 1z"/>
            <line x1="8" y1="6" x2="8" y2="10"/>
            <circle cx="8" cy="12.5" r="0.7" fill="currentColor" stroke="none"/>
          </svg>
          {{ error }}
        </div>
        {% endif %}

        <div class="form-group">
          <label class="form-label" for="password">Access Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter operator password"
            autocomplete="current-password"
            autofocus
            required
          >
        </div>

        <button type="submit" class="btn btn-primary login-btn btn-ripple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Access Dashboard
        </button>

        <p class="login-hint">
          Default password: <code style="color:var(--orange); font-family:monospace">navixa2026</code>
        </p>

      </form>

      <div class="login-back">
        <a href="{{ url_for('index') }}">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" aria-hidden="true">
            <line x1="13" y1="8" x2="3" y2="8"/>
            <polyline points="7,4 3,8 7,12"/>
          </svg>
          Back to landing page
        </a>
      </div>

    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
