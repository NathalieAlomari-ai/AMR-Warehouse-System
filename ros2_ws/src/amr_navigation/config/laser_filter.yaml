# LaserScanBoxFilter — drops laser returns that fall INSIDE the robot chassis,
# i.e. the 4 scissor-lift pillars that sit within the footprint and otherwise
# get scan-matched against the map (corrupting AMCL) and inflated as phantom
# obstacles in the local costmap.
#
# Wiring (see bringup.launch.py): sllidar → /scan_raw → THIS filter → /scan
# Everything downstream (AMCL, local + global costmaps) reads /scan unchanged.
#
# Box is defined in the LASER frame (the scan's own frame) so tf2 returns
# identity and NO transform lookup is needed. Using base_link here made the
# filter depend on a laser->base_link transform at each scan's timestamp; when
# that lookup failed the whole chain returned false and published an EMPTY
# /scan (all returns dropped). The laser is mounted at base_link x = -0.25 m
# (rear), so the chassis box (base_link x ±0.32, y ±0.27) becomes, in the laser
# frame, x [-0.07, 0.57], y [-0.27, 0.27]. z stays wide. invert:false = remove
# points INSIDE box.
scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: chassis_box_filter
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: laser
        min_x: -0.07
        max_x: 0.57
        min_y: -0.27
        max_y: 0.27
        min_z: -1.0
        max_z: 1.0
        invert: false
